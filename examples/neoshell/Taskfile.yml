# Taskfile for neoshell. Requires go-task (https://taskfile.dev).
#
#   task dev     run the GTK shell, rebuilding and restarting it on every
#                source or style.css change
version: "3"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  install:
    desc: Install workspace dependencies (bun)
    cmds:
      - bun install

  dev:
    desc: Run the GTK shell, rebuilding and restarting it on every change (root `neoshell:dev`)
    interactive: true
    cmds:
      - '{{.TASK_EXE}} -d {{.ROOT_DIR}}/../.. neoshell:dev'

  lint:
    desc: Lint TS/JS with oxlint and Svelte markup with ESLint
    cmds:
      - bun run lint

  lint:fix:
    desc: Apply oxlint and ESLint autofixes
    cmds:
      - bun run lint:fix

  test:
    desc: Run the surface package tests
    cmds:
      - cd packages/surface && bun test

  monitors:
    desc: List monitor connectors
    cmds:
      - hyprctl monitors -j | jq -r '.[].name'
