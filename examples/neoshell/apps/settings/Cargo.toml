[package]
name = "neoshell-settings"
version = "0.1.0"
edition = "2021"
description = "Standalone settings app for neoshell — a Tauri WebView window over the WS bus"

[[bin]]
name = "neoshell-settings"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
opt-level = "s"
