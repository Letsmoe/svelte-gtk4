[package]
name = "neoshell-bg"
version = "0.1.0"
edition = "2021"
description = "Wayland wallpaper daemon for neoshell — paints a background layer and samples the colors behind the bar"

[[bin]]
name = "neoshell-bg"
path = "src/main.rs"

[dependencies]
# Wayland + wlr-layer-shell + wl_shm (same stack as the render host).
wayland-client = "0.31"
smithay-client-toolkit = "0.19"
calloop = "0.14"
calloop-wayland-source = "0.4"

# Image decode + scaling for wallpapers.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Control protocol with the CLI client and the Go core.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging.
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
